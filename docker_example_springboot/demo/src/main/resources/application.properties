spring.application.name=demo

#sql db setting
spring.datasource.url=${SPRING_DATASOURCE_URL : jdbc:mysql://localhost:33306/classicmodels}
spring.datasource.username=springboot
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Keycloak settings
keycloak.realm=backend
keycloak.auth-server-url=http://localhost:4000/auth
keycloak.resource=springboot
keycloak.credentials.secret=your_client_secret
keycloak.ssl-required=external
keycloak.use-resource-role-mappings=true

# OAuth2 Resource Server settings
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:4000/auth/realms/backend