spring.application.name=demo

#sql db setting
spring.datasource.url=${SPRING_DATASOURCE_URL : jdbc:mysql://localhost:33306/classicmodels}
spring.datasource.username=springboot
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

#keycloak setting
keycloak.realm=backend
keycloak.auth-server-url=http://keycloak_container:4000/auth
keycloak.resource=keycloak
keycloak.credentials.secret=your_client_secret
keycloak.use-resource-role-mappings=true
keycloak.security-constraints[0].authRoles[0]=user
keycloak.security-constraints[0].securityCollections[0].patterns[0]=/*

